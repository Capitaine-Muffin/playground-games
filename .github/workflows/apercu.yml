name: Aperçu de branche

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages

jobs:
  publier:
    name: Mettre l'aperçu en ligne
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # On régénère au lieu de vérifier : un aperçu doit s'afficher même si le
      # manifeste a été oublié. C'est le job « Vérification » qui bloque le merge.
      - name: Régénérer le manifeste
        run: node tools/build-index.mjs

      - name: Publier l'aperçu
        run: tools/publier.sh previews/pr-${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Poser le lien sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const base = `https://${context.repo.owner}.github.io/${context.repo.repo}`;
            const url = `${base}/previews/pr-${context.issue.number}/`;
            const marqueur = '<!-- apercu-branche -->';
            const corps = [
              marqueur,
              `### 🎮 Aperçu de cette branche`,
              ``,
              `**${url}**`,
              ``,
              `Le hub et les jeux tels qu'ils seront après le merge. Le lien se met à`,
              `jour à chaque push et disparaît à la fermeture de la PR.`,
            ].join('\n');

            const { data: commentaires } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existant = commentaires.find((c) => c.body.includes(marqueur));
            if (existant) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existant.id, body: corps });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: corps });
            }

  nettoyer:
    name: Retirer l'aperçu
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supprimer l'aperçu
        run: tools/publier.sh --supprimer previews/pr-${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
